<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>La TVA — Partie 1 · La déclaration périodique</title>
<meta name="description" content="Application d'entraînement — 6e Technicien en comptabilité : la déclaration périodique à la TVA (régimes, grilles, Intervat, Mosaïk Design, Plume &amp; Cie).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DESIGN SYSTEM — thème sombre « arcade » + code couleur du cours
   (cadre IV rouge · cadre V bleu · cadre VI ocre · violet du cours)
   ===================================================================== */
:root{
  --bg:#070b14; --bg2:#0d1322; --bg3:#141c2f; --card:#101828; --card2:#162038;
  --border:#232f48; --border2:#33415f;
  --text:#e9eef8; --text2:#a6b2c9; --text3:#717e9a;
  --accent:#22d68a; --accent2:#14b8a6; --orange:#ff8a3d; --gold:#ffc53d;
  --violet:#8b5cf6; --violet2:#6d3fd1;
  --success:#22d68a; --error:#ff4d6d;
  --g2:#a5b4cc; --g4:#ff5c7a; --g5:#4ea8ff; --g6:#f2a43a;
  --radius:16px; --radius-s:10px;
  --shadow:0 12px 34px rgba(0,0,0,.38);
  --hud-h:104px;
  /* documents « papier » (écran Intervat, factures, dossier) */
  --paper:#ffffff; --ink:#1d2433; --ink2:#5b6478; --pline:#e3e7ef;
  --p-iv:#b4234a; --p-iv-bg:#fbeef1; --p-v:#1f5fa8; --p-v-bg:#eaf1fb;
  --p-vi:#9a5b0a; --p-vi-bg:#f7efe4; --p-vio:#6b3fa0; --p-vio-bg:#efeaf7;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.55;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 620px at 8% -12%,rgba(139,92,246,.20),transparent 60%),
  radial-gradient(820px 600px at 108% 6%,rgba(34,214,138,.12),transparent 60%),
  radial-gradient(760px 520px at 50% 122%,rgba(78,168,255,.11),transparent 60%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 75%)}
h1,h2,h3,h4{line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
p{margin:0 0 .75em}
b,strong{font-weight:700}
.mono{font-family:'Space Mono',ui-monospace,monospace}
.muted{color:var(--text2)}
.small{font-size:.86rem}
.center{text-align:center}
.skip{position:absolute;left:-999px;top:0;background:var(--gold);color:#000;padding:8px 12px;z-index:9999;border-radius:0 0 8px 0}
.skip:focus{left:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font-family:inherit}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.78em 1.3em;border-radius:12px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font:600 1rem 'Outfit',sans-serif;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s;text-decoration:none;line-height:1.2}
.btn:hover{transform:translateY(-1px);border-color:var(--text3)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#03140d;border:none;box-shadow:0 8px 22px rgba(34,214,138,.26)}
.btn-primary:hover{box-shadow:0 12px 30px rgba(34,214,138,.36)}
.btn-violet{background:linear-gradient(135deg,#8b5cf6,#6d3fd1);color:#fff;border:none;box-shadow:0 8px 22px rgba(139,92,246,.3)}
.btn-ghost{background:transparent}
.btn-sm{padding:.5em .9em;font-size:.9rem;border-radius:10px}
.btn-lb{background:transparent;border-color:var(--accent);color:var(--accent)}
.btn-lb:hover{background:var(--accent);color:#03140d}
.btn-lb.g{border-color:var(--orange);color:var(--orange)}
.btn-lb.g:hover{background:var(--orange);color:#1a0d02}
.btn-print{background:#fff;color:#1d2433;border:none}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:100;background:rgba(7,11,20,.80);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--border)}
.hud-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px 6px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--text);cursor:pointer;font:700 1rem 'Outfit',sans-serif;padding:2px;border-radius:10px}
.logo svg{width:36px;height:36px;display:block}
.logo-t{white-space:nowrap}
.logo-t small{display:block;font-weight:500;font-size:.72rem;color:var(--text3);letter-spacing:.04em}
.lvpills{display:flex;gap:6px;margin:0 auto}
.lvpill{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 .85rem 'Space Mono',monospace;border:1.5px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;padding:0;transition:.2s}
.lvpill.done{background:rgba(34,214,138,.16);border-color:var(--accent);color:var(--accent)}
.lvpill.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px rgba(255,197,61,.18)}
.lvpill.locked{opacity:.38;cursor:not-allowed}
.hud-chips{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);font-size:.86rem;color:var(--text2);white-space:nowrap}
.chip b{color:var(--text)}
.chip.hot{border-color:var(--orange);color:var(--orange);animation:pulse 1s infinite}
.icbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:1.05rem;display:grid;place-items:center;color:var(--text);padding:0;transition:.15s}
.icbtn:hover{border-color:var(--text3);transform:translateY(-1px)}
.xpbar{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:2px 16px 9px;font-size:.8rem;color:var(--text2)}
.xp-rank{white-space:nowrap;font-weight:700;color:var(--text)}
.xp-track{position:relative;flex:1;height:10px;border-radius:99px;background:var(--bg3);border:1px solid var(--border)}
.xp-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--accent));width:0;transition:width .7s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.xp-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);animation:shimmer 2.6s infinite}
.xp-mark{position:absolute;top:-4px;width:2px;height:16px;background:var(--text3);border-radius:2px;transform:translateX(-1px)}
.xp-mark.reached{background:var(--accent)}
.xp-mark span{position:absolute;top:-1px;left:5px;font-size:.72rem;line-height:1}
.xp-next{white-space:nowrap}
.xp-next b{color:var(--gold)}

/* ---------- Conteneur ---------- */
#main{max-width:920px;margin:0 auto;padding:22px 16px 90px;outline:none}
#main.wide{max-width:1320px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.sec-title{display:flex;align-items:center;gap:10px;font-size:1.25rem;margin:26px 0 12px}
.kicker{font:700 .78rem 'Outfit',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
.pill-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:rgba(139,92,246,.14);color:#c4b2ff;border:1px solid rgba(139,92,246,.35)}

/* ---------- Accueil ---------- */
.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:26px;align-items:center;margin-top:8px}
.hero h1{font-size:clamp(2rem,5.4vw,3.35rem);font-weight:900;letter-spacing:-.025em;margin:.25em 0 .35em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#b49cff,#22d68a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .tagline{font-size:1.12rem;color:var(--text2);max-width:34em}
.hero-art{background:radial-gradient(circle at 50% 40%,rgba(139,92,246,.22),transparent 65%);border-radius:24px;padding:10px}
.hero-art svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:1.45rem;line-height:1.2}
.stat span{font-size:.78rem;color:var(--text2)}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:rgba(34,214,138,.07);border:1px solid rgba(34,214,138,.3);margin:14px 0;font-size:.92rem}
.goals{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.goals li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg3);border:1px solid var(--border)}
.goals li .ic{font-size:1.2rem}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.resume{border:1px solid var(--gold);background:rgba(255,197,61,.08);border-radius:14px;padding:14px 16px;margin:14px 0}

/* ---------- Parcours (hub) ---------- */
.path{position:relative;padding:6px 0 10px}
.path::before{content:"";position:absolute;left:50%;top:10px;bottom:10px;border-left:3px dashed var(--border2);transform:translateX(-50%)}
.pnode{position:relative;display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;margin:16px 0}
.pnode .dot{grid-column:2;grid-row:1;justify-self:center;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:800 1.15rem 'Space Mono',monospace;background:var(--bg3);border:2px solid var(--border2);z-index:1;color:var(--text2)}
.pnode.done .dot{background:var(--accent);color:#03140d;border-color:var(--accent);box-shadow:0 0 22px rgba(34,214,138,.35)}
.pnode.next .dot{border-color:var(--gold);color:var(--gold);background:#1b1708;animation:pulseGold 1.7s infinite}
.pnode.locked .dot{opacity:.55}
.pnode .lvcard{grid-column:1;grid-row:1}
.pnode.r .lvcard{grid-column:3}
.lvcard{display:block;width:100%;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;color:var(--text);cursor:pointer;transition:.2s;box-shadow:var(--shadow);font:inherit}
.lvcard:hover{transform:translateY(-2px);border-color:var(--violet)}
.pnode.locked .lvcard{opacity:.55;cursor:not-allowed;transform:none}
.lvcard .top{display:flex;align-items:center;gap:10px}
.lvcard .ic{font-size:1.7rem}
.lvcard h3{font-size:1.08rem;margin:0}
.lvcard .sub{font-size:.86rem;color:var(--text2);margin:6px 0 8px}
.lvcard .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--text2)}
.stars{color:var(--gold);letter-spacing:2px}
.stars .off{color:var(--border2)}
.trophies{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.troph{text-align:center;padding:12px 8px;border-radius:14px;background:var(--bg3);border:1px solid var(--border)}
.troph .ic{font-size:2rem;line-height:1.2}
.troph b{display:block;font-size:.9rem;margin-top:4px}
.troph small{display:block;color:var(--text3);font-size:.74rem;line-height:1.3;margin-top:3px}
.troph.on{border-color:rgba(255,197,61,.55);background:linear-gradient(180deg,rgba(255,197,61,.10),transparent)}
.troph.off{filter:grayscale(1);opacity:.5}

/* ---------- Briefing ---------- */
.brief-head{display:flex;gap:16px;align-items:center}
.brief-ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:2rem;background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(34,214,138,.2));border:1px solid var(--border2);flex:none}
.brief-head h1{font-size:clamp(1.4rem,3.4vw,2rem);margin:.15em 0}
.objs{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.objs li{display:flex;gap:10px;align-items:flex-start}
.objs li::before{content:"🎯";flex:none}
.box{border-radius:14px;padding:14px 16px;margin:14px 0;border:1px solid var(--border2);background:var(--bg3)}
.box > .bt{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:6px;font-size:.98rem}
.box.ex{border-color:rgba(255,138,61,.5);background:rgba(255,138,61,.07)}
.box.ex > .bt{color:#ffb27f}
.box.hard{border-color:rgba(255,92,122,.5);background:rgba(255,92,122,.07)}
.box.hard > .bt{color:#ff9db0}
.box.plus{border-color:rgba(255,197,61,.5);background:rgba(255,197,61,.06)}
.box.plus > .bt{color:var(--gold)}
.box.rap > .bt{color:#c4b2ff}
.box ul{margin:.3em 0 .5em;padding-left:1.2em}
.box li{margin:.25em 0}
.illus{margin:14px 0;border-radius:14px;overflow:hidden}
.illus svg{width:100%;height:auto;display:block}
.predict{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.pbtn{padding:14px 10px;border-radius:12px;border:1.5px solid var(--border2);background:var(--bg3);color:var(--text);font:600 .98rem 'Outfit',sans-serif;cursor:pointer;transition:.15s}
.pbtn:hover{border-color:var(--gold)}
.pbtn.on{border-color:var(--gold);background:rgba(255,197,61,.13);box-shadow:0 0 0 3px rgba(255,197,61,.15)}
.company{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center}
.company svg{width:100%;height:auto;border-radius:12px;display:block}

/* ---------- Coup d'œil (schéma du cours) ---------- */
.cdo{display:grid;grid-template-columns:84px 1fr 92px 1fr;gap:8px 10px;align-items:center;margin:8px 0}
.cdo-h{font-size:.8rem;font-weight:700;color:var(--text2);text-align:center}
.cdo-lab{font-weight:800;text-align:center;font-size:.92rem}
.cdo-lab small{display:block;font-weight:500;color:var(--text3)}
.cdo-box{text-align:left;border-radius:12px;padding:10px 12px;border:2px solid var(--g2);background:rgba(165,180,204,.07);color:var(--text);cursor:pointer;font:500 .84rem 'Outfit',sans-serif;line-height:1.45;transition:.15s;width:100%}
.cdo-box:hover,.cdo-box.on{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.cdo-box b{display:block;font-size:.95rem;margin-bottom:2px}
.cdo-box span{display:block}
.cdo-box .mono{font-size:.8rem}
.cdo-box.c4{border-color:var(--g4);background:rgba(255,92,122,.08)} .cdo-box.c4 b{color:var(--g4)}
.cdo-box.c5{border-color:var(--g5);background:rgba(78,168,255,.08)} .cdo-box.c5 b{color:var(--g5)}
.cdo-box.c6{border-color:var(--g6);background:rgba(242,164,58,.08)} .cdo-box.c6 b{color:var(--g6)}
.cdo-arr{text-align:center;font-size:.76rem;color:var(--text2);line-height:1.2}
.cdo-arr::after{content:"⟶";display:block;font-size:1.4rem;color:var(--text3)}
.cdo-diag{text-align:center;font:700 .78rem 'Space Mono',monospace;color:var(--g4)}
.cdo-op{justify-self:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--g6);color:var(--g6);display:grid;place-items:center;font-weight:800}
.cdo-detail{margin-top:10px;border-radius:12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border2);font-size:.9rem}
.cdo-detail table{width:100%;border-collapse:collapse}
.cdo-detail td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:top}

/* ---------- Puces de grilles ---------- */
.gc{display:inline-block;min-width:30px;text-align:center;font:700 .78rem 'Space Mono',monospace;padding:1px 6px;border-radius:6px;border:1.5px solid var(--g2);color:var(--text);background:rgba(165,180,204,.08);margin:1px 2px 1px 0;white-space:nowrap}
.gc.k4{border-color:var(--g4);color:#ff9db0;background:rgba(255,92,122,.1)}
.gc.k5{border-color:var(--g5);color:#9fd0ff;background:rgba(78,168,255,.1)}
.gc.k6{border-color:var(--g6);color:#ffd08a;background:rgba(242,164,58,.1)}

/* ---------- Question ---------- */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qmission{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text2);font-size:.92rem}
.qpills{display:flex;gap:6px;align-items:center}
.qpill{width:13px;height:13px;border-radius:50%;background:var(--border2);transition:.2s}
.qpill.correct{background:var(--accent)}
.qpill.hint{background:var(--orange)}
.qpill.shown{background:var(--error)}
.qpill.cur{background:var(--gold);box-shadow:0 0 0 4px rgba(255,197,61,.22)}
.qcard{position:relative}
.qtag{display:inline-flex;gap:8px;align-items:center;font:700 .78rem 'Space Mono',monospace;color:var(--text3);letter-spacing:.02em;margin-bottom:10px;text-transform:none}
.qtag .t{color:#c4b2ff}
.qprompt{font-size:1.1rem;margin:0 0 14px;line-height:1.55}
.data{display:block;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.3);border-left:4px solid var(--violet);border-radius:10px;padding:10px 14px;margin:10px 0 14px;line-height:1.6}
.soldes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 16px}
.solde{border-radius:12px;padding:12px 14px;font:700 .95rem 'Outfit',sans-serif;line-height:1.35}
.solde .mono{display:block;font-size:1.15rem;margin-top:2px}
.solde.d{background:rgba(78,168,255,.1);border:1.5px solid var(--g5);color:#a9d4ff}
.solde.c{background:rgba(255,92,122,.1);border:1.5px solid var(--g4);color:#ffb3c1}
.statement{font-size:1.12rem;font-style:italic;padding:14px 16px;border-left:4px solid var(--gold);background:rgba(255,197,61,.07);border-radius:10px;margin:4px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border2);background:var(--bg3);color:var(--text);font:500 1rem 'Outfit',sans-serif;cursor:pointer;transition:.15s;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--violet);transform:translateX(2px)}
.opt[disabled]{cursor:default}
.opt .ol{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:700 .85rem 'Space Mono',monospace;background:var(--bg2);border:1px solid var(--border2)}
.opt.sel{border-color:var(--violet);background:rgba(139,92,246,.13)}
.opt.sel .ol{background:var(--violet);border-color:var(--violet);color:#fff}
.opt.good{border-color:var(--accent);background:rgba(34,214,138,.12)}
.opt.good .ol{background:var(--accent);color:#03140d;border-color:var(--accent)}
.opt.bad{border-color:var(--error);background:rgba(255,77,109,.09);opacity:.85}
.opt.miss{border-style:dashed;border-color:var(--accent)}
.opt .box2{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--border2);display:grid;place-items:center;font-size:.85rem;margin-top:2px}
.opt.sel .box2{background:var(--violet);border-color:var(--violet);color:#fff}
.opt.good .box2{background:var(--accent);border-color:var(--accent);color:#03140d}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vfbtn{padding:18px;border-radius:14px;font:800 1.15rem 'Outfit',sans-serif;cursor:pointer;border:2px solid var(--border2);background:var(--bg3);color:var(--text);transition:.15s}
.vfbtn:hover:not([disabled]){transform:translateY(-2px)}
.vfbtn.v:hover:not([disabled]){border-color:var(--accent)}
.vfbtn.f:hover:not([disabled]){border-color:var(--error)}
.vfbtn.good{border-color:var(--accent);background:rgba(34,214,138,.14)}
.vfbtn.bad{border-color:var(--error);background:rgba(255,77,109,.12)}
.vfbtn[disabled]{cursor:default}
.numrow{display:flex;align-items:center;gap:10px;max-width:400px}
.numrow label{display:block;font-weight:700;margin-bottom:6px}
.numin{flex:1;width:100%;font:700 1.3rem 'Space Mono',monospace;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border2);background:var(--bg2);color:var(--text);text-align:right}
.numin:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px rgba(139,92,246,.25)}
.numin.ok{border-color:var(--accent)} .numin.ko{border-color:var(--error)}
.unit{font:700 1.2rem 'Space Mono',monospace;color:var(--text2)}
.calc{font:700 .9rem 'Space Mono',monospace;color:var(--accent);min-height:1.5em;margin-top:6px}

/* éléments déplaçables (clic-clic) */
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1.5px dashed var(--border2);border-radius:14px;min-height:58px;margin:4px 0 14px;background:rgba(255,255,255,.015)}
.pool:empty::before{content:"Réserve vide ✔";color:var(--text3);font-size:.88rem;align-self:center}
.pool-title{font-size:.8rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:2px 0 4px}
.tagi{display:inline-block;padding:8px 12px;border-radius:10px;background:var(--bg3);border:1.5px solid var(--border2);color:var(--text);font:500 .92rem 'Outfit',sans-serif;cursor:pointer;text-align:left;max-width:100%;line-height:1.35;transition:.15s}
.tagi:hover:not([disabled]){border-color:var(--violet)}
.tagi.pick{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,197,61,.25);transform:translateY(-2px)}
.tagi.ok{border-color:var(--accent);background:rgba(34,214,138,.1);cursor:default}
.tagi.ok2{border-color:var(--orange);background:rgba(255,138,61,.1);cursor:default}
.tagi.ko{border-color:var(--error);background:rgba(255,77,109,.1);cursor:default}
.tagi .fix,.fixline{display:block;font:700 .78rem 'Space Mono',monospace;color:#ff9db0;margin-top:4px}
.tagi .lk{float:right;margin-left:6px;font-size:.8rem}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.zone{border:1.5px solid var(--border2);border-radius:14px;padding:10px;min-height:130px;background:rgba(255,255,255,.02);cursor:pointer;transition:.15s;text-align:left;color:var(--text);font:inherit;display:flex;flex-direction:column}
.zone.target{border-color:var(--gold);background:rgba(255,197,61,.05)}
.zone h5{margin:0;font-size:1rem}
.zone small{color:var(--text3);font-family:'Space Mono',monospace;font-size:.78rem}
.zitems{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mtable{width:100%;border-collapse:separate;border-spacing:0 8px}
.mtable td{background:var(--bg3);padding:10px 12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);vertical-align:middle}
.mtable td:first-child{border-left:1px solid var(--border);border-radius:10px 0 0 10px;font:800 .95rem 'Space Mono',monospace;color:#c4b2ff;width:34px;text-align:center}
.mtable td:last-child{border-right:1px solid var(--border);border-radius:0 10px 10px 0;width:44%}
.msel{width:100%;padding:9px 10px;border-radius:9px;border:1.5px solid var(--border2);background:var(--bg2);color:var(--text);font:700 .88rem 'Space Mono',monospace;cursor:pointer}
.msel:focus{border-color:var(--violet);outline:none}
.mrow.ok .msel{border-color:var(--accent);background:rgba(34,214,138,.1)}
.mrow.ok2 .msel{border-color:var(--orange);background:rgba(255,138,61,.1)}
.mrow.ko .msel{border-color:var(--error);background:rgba(255,77,109,.1)}
.slots{display:grid;gap:8px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 10px;border:1.5px dashed var(--border2);border-radius:12px;cursor:pointer;background:rgba(255,255,255,.015);color:var(--text);font:inherit;text-align:left;width:100%}
.slot.target{border-color:var(--gold)}
.slot .n{width:30px;height:30px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.slot.filled{border-style:solid}
.slot.ok{border-color:var(--accent);background:rgba(34,214,138,.08);cursor:default}
.slot.ok2{border-color:var(--orange);background:rgba(255,138,61,.08);cursor:default}
.slot.ko{border-color:var(--error);background:rgba(255,77,109,.08);cursor:default}
.slot .empty{color:var(--text3);font-size:.9rem}
.slot svg,.tagi svg{width:22px;height:22px;vertical-align:-6px;margin-right:6px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.cloze{font-size:1.04rem;line-height:2.15;background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.blank{display:inline-flex;align-items:center;min-width:100px;justify-content:center;padding:0 10px;margin:0 2px;border-radius:8px;border:1.5px dashed var(--violet);background:rgba(139,92,246,.08);color:var(--text);font:700 .95rem 'Outfit',sans-serif;cursor:pointer;vertical-align:baseline;line-height:1.9}
.blank.filled{border-style:solid}
.blank.ok{border-color:var(--accent);background:rgba(34,214,138,.12);cursor:default}
.blank.ok2{border-color:var(--orange);background:rgba(255,138,61,.12);cursor:default}
.blank.ko{border-color:var(--error);background:rgba(255,77,109,.12);cursor:default}
.blank .fx{font:700 .74rem 'Space Mono',monospace;color:#ff9db0;margin-left:6px}
.bounce{animation:bounce .55s}

/* Chasse aux erreurs : carnet du stagiaire */
.lucas{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lucas svg{width:58px;height:58px;flex:none}
.notebook{background:#fffdf3;color:#2a2f3a;border-radius:12px;padding:14px 14px 14px 46px;position:relative;box-shadow:0 14px 40px rgba(0,0,0,.35);background-image:repeating-linear-gradient(#fffdf3 0 33px,#e3ebfb 33px 34px)}
.notebook::before{content:"";position:absolute;left:32px;top:0;bottom:0;width:2px;background:#f2a1a1}
.nb-title{font:800 .95rem 'Outfit',sans-serif;color:#6b3fa0;margin:0 0 6px}
.hline{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:8px;font:500 .95rem 'Outfit',sans-serif;color:inherit;cursor:pointer;line-height:1.45;margin:2px 0;transition:.12s}
.hline:hover:not([disabled]){background:rgba(139,92,246,.10)}
.hline .hn{font:700 .8rem 'Space Mono',monospace;color:#6b3fa0;margin-right:4px}
.hline.flag{background:rgba(255,197,61,.38);box-shadow:inset 0 0 0 2px #e3a500}
.hline.ok{background:rgba(34,197,94,.16);box-shadow:inset 0 0 0 2px #16a34a;cursor:default}
.hline.ok2{background:rgba(234,138,12,.16);box-shadow:inset 0 0 0 2px #ea8a0c;cursor:default}
.hline.ko{background:rgba(220,38,69,.10);box-shadow:inset 0 0 0 2px #dc2645;cursor:default}
.hline.fine{opacity:.75;cursor:default}
.hline .fixok{display:block;font-size:.86rem;color:#0f6b33;margin-top:3px;font-weight:600}
.hline .tagok{font-size:.78rem;font-weight:800;color:#16a34a;margin-left:6px}
.hline.fa{animation:shake .45s}

/* Feedback */
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;border:1px solid;animation:slideUp .3s}
.fb h4{margin:0 0 6px;font-size:1.02rem}
.fb p:last-child{margin-bottom:0}
.fb.ok{border-color:rgba(34,214,138,.5);background:rgba(34,214,138,.08)}
.fb.hint{border-color:rgba(255,138,61,.5);background:rgba(255,138,61,.08)}
.fb.shown{border-color:rgba(255,77,109,.5);background:rgba(255,77,109,.08)}
.fb.info{border-color:rgba(139,92,246,.45);background:rgba(139,92,246,.08)}
.fb ul{margin:.3em 0;padding-left:1.2em}
.fb .calc-t{width:100%;border-collapse:collapse;margin-top:8px;font-size:.9rem}
.fb .calc-t td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.fb .calc-t td:last-child{text-align:right;font-family:'Space Mono',monospace;font-weight:700;white-space:nowrap}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.actions .warn{flex:1;min-width:220px;color:var(--gold);font-size:.9rem}
.shake{animation:shake .45s}
details.more{margin-top:12px;border:1px solid var(--border2);border-radius:12px;padding:10px 14px;background:var(--bg2)}
details.more summary{cursor:pointer;font-weight:700;color:#c4b2ff}

/* ---------- Poste de travail (dossier + exercice) ---------- */
.ws{display:grid;grid-template-columns:minmax(320px,.8fr) 1.2fr;gap:18px;align-items:start;margin-top:4px}
.ws-tabs{display:none}
.ws-main{min-width:0}
.ws-dossier{position:sticky;top:calc(var(--hud-h) + 12px);align-self:start;min-width:0}
.dossier{max-height:calc(100vh - var(--hud-h) - 24px);overflow:auto;background:#fbfaf5;color:var(--ink);border-radius:14px;border:1px solid #e3dfd2;box-shadow:0 18px 50px rgba(0,0,0,.35);overscroll-behavior:contain}
.dz-head{position:sticky;top:0;z-index:2;background:#fbfaf5;padding:12px 14px 10px;border-bottom:2px solid #6b3fa0}
.dz-head b{font-size:1rem}
.dz-head .muted2{font-size:.8rem;color:var(--ink2)}
.dz-sect{font:800 .8rem 'Outfit',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#6b3fa0;padding:10px 14px 4px}
.dz-table{width:100%;border-collapse:collapse;font-size:.84rem}
.dz-table th{background:#6b3fa0;color:#fff;font-weight:700;text-align:left;padding:6px 8px;font-size:.78rem}
.dz-table th.num{text-align:right}
.dz-table td{padding:7px 8px;border-bottom:1px solid #ece8dc;vertical-align:top;transition:background .2s}
.dz-table td.num{text-align:right;font-family:'Space Mono',monospace;white-space:nowrap;font-size:.8rem}
.dz-table td.ref{font:700 .8rem 'Space Mono',monospace;color:#6b3fa0;width:30px}
.dz-table td.grids{min-width:74px}
.dz-table tr.hl td{background:#fff1b8}
.dz-table tr.hl td.ref{box-shadow:inset 3px 0 0 #e3a500}
.dz-foot{padding:8px 14px 12px;font-size:.78rem;color:var(--ink2)}
.pg{display:inline-block;font:700 .72rem 'Space Mono',monospace;padding:0 5px;border-radius:5px;border:1.5px solid #8a93a6;margin:1px 2px 1px 0;background:#fff;color:#2b3242;white-space:nowrap}
.pg.k4{border-color:var(--p-iv);color:var(--p-iv);background:var(--p-iv-bg)}
.pg.k5{border-color:var(--p-v);color:var(--p-v);background:var(--p-v-bg)}
.pg.k6{border-color:var(--p-vi);color:var(--p-vi);background:var(--p-vi-bg)}
.pg.glow{box-shadow:0 0 0 3px rgba(139,92,246,.45)}
.pg-minus{font:700 .72rem 'Space Mono',monospace;color:#6b7385;margin-right:2px}
.callout{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#6b3fa0;color:#fff;font:800 .72rem 'Outfit',sans-serif;margin-right:4px;vertical-align:1px}

/* ---------- Écran Intervat (reconstitué, simplifié) ---------- */
.iv{container-type:inline-size;background:#fff;color:var(--ink);border-radius:14px;border:1px solid #cfd6e4;box-shadow:0 18px 50px rgba(0,0,0,.38);overflow:hidden;overflow:clip;font-size:.9rem}
.iv-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#e9edf4;border-bottom:1px solid #d5dbe6}
.iv-dots{display:flex;gap:6px}
.iv-dots i{width:11px;height:11px;border-radius:50%;background:#c4cad6;display:block}
.iv-url{flex:1;background:#fff;border-radius:8px;padding:4px 12px;color:#4b5568;font-size:.84rem;border:1px solid #dde2ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv-url b{color:#1d2433}
.iv-head{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--pline);flex-wrap:wrap}
.iv-head .t{font-weight:800;font-size:1.05rem}
.iv-head .r{text-align:right;color:#5b6478;font-size:.86rem}
.iv-steps{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--pline);font-size:.86rem;color:#6b7385}
.iv-step{display:flex;align-items:center;gap:6px;white-space:nowrap}
.iv-step i{width:22px;height:22px;border-radius:50%;border:1.5px solid #9aa3b5;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.76rem}
.iv-step.on{color:var(--ink);font-weight:700}
.iv-step.on i{background:#1d2433;color:#fff;border-color:#1d2433}
.iv-step.okk i{background:#16a34a;color:#fff;border-color:#16a34a}
.iv-sep{flex:1;border-top:1.5px dashed #c9cfda;min-width:10px}
.iv-guide{margin:10px 16px 0;padding:8px 12px;border-radius:8px;background:var(--p-vio-bg);color:#4a2a7a;font-size:.84rem;border:1px solid #d9cdef}
.iv-body{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;padding:12px 16px 6px}
.iv-cadre{margin-bottom:10px}
.iv-cadre h4{margin:0 0 4px;padding:6px 10px;border-radius:6px;font-size:.9rem;background:#eef1f6;border-left:4px solid #6b7385;color:#1d2433}
.iv-cadre.c4 h4{background:var(--p-iv-bg);border-left-color:var(--p-iv);color:var(--p-iv)}
.iv-cadre.c5 h4{background:var(--p-v-bg);border-left-color:var(--p-v);color:var(--p-v)}
.iv-cadre.c6 h4{background:var(--p-vi-bg);border-left-color:var(--p-vi);color:var(--p-vi)}
.iv-row{display:grid;grid-template-columns:40px 1fr minmax(96px,124px);align-items:center;gap:8px;padding:3px 4px;border-bottom:1px solid #f0f2f6;border-radius:6px;transition:background .2s}
.iv-row .gcode{font:700 .8rem 'Space Mono',monospace;border:1.5px solid #8a93a6;border-radius:6px;text-align:center;padding:1px 0;color:#2b3242;background:#fff}
.c4 .gcode{border-color:var(--p-iv);color:var(--p-iv);background:var(--p-iv-bg)}
.c5 .gcode{border-color:var(--p-v);color:var(--p-v);background:var(--p-v-bg)}
.c6 .gcode{border-color:var(--p-vi);color:var(--p-vi);background:var(--p-vi-bg)}
.iv-row .gl{font-size:.86rem;line-height:1.25}
.iv-row.tot .gl{font-weight:800}
.iv-in{width:100%;font:700 .88rem 'Space Mono',monospace;text-align:right;padding:5px 7px;border:1.5px solid #c9cfda;border-radius:7px;background:#fff;color:var(--ink);min-width:0}
.iv-in::placeholder{color:#a3abbb;font-weight:400}
.iv-in:focus{outline:none;border-color:#6d3fd1;box-shadow:0 0 0 3px rgba(139,92,246,.25)}
.iv-in.todo{border-style:dashed;border-color:#8b5cf6;background:#faf7ff}
.iv-in.given{background:#f1f3f8;color:#3b4354;border-color:#e0e4ec}
.iv-in.na{background:#f8f9fb;border-color:#eceff4}
.iv-in.later{background:#f8f9fb;border-color:#eceff4;font-size:.72rem;font-family:'Outfit',sans-serif;color:#9aa3b5}
.iv-in[disabled]{opacity:1;-webkit-text-fill-color:currentColor}
.iv-row.ok .iv-in{border-color:#16a34a;background:#effaf3;color:#0f6b33}
.iv-row.ok2 .iv-in{border-color:#ea8a0c;background:#fff6e9;color:#8a4b00}
.iv-row.ko .iv-in{border-color:#dc2645;background:#fdeef1;color:#a1122e}
.iv-row.xtra .iv-in{border-color:#dc2645}
.iv-fix{grid-column:2 / 4;font:700 .76rem 'Space Mono',monospace;color:#c8183a;text-align:right;margin-top:-2px}
.iv-fix.soft{color:#8a4b00}
.iv-row.hl{background:#fff4c8}
.iv-row.hlf{background:#efe8ff}
.iv-refund{display:flex;align-items:center;gap:8px;font-size:.84rem;color:#4b5568;margin:6px 0 0 4px}
.iv-refund input{width:18px;height:18px}
.iv-foot{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--pline);background:#f8f9fc;flex-wrap:wrap;position:sticky;bottom:0;z-index:5;box-shadow:0 -8px 18px rgba(29,36,51,.10)}
.iv-status{flex:1;min-width:200px;font-size:.84rem;color:#4b5568;min-height:1.3em;line-height:1.4}
.iv-status .calcp{font:700 .84rem 'Space Mono',monospace;color:#0f7a4a}
.iv-status b{color:#1d2433}
.iv-btn{padding:8px 14px;border-radius:9px;font:700 .9rem 'Outfit',sans-serif;cursor:pointer;border:1.5px solid #1d2433;background:#fff;color:#1d2433}
.iv-btn.main{background:#1d2433;color:#fff}
.iv-btn[disabled]{opacity:.4;cursor:not-allowed}
.iv-note{font-size:.78rem;color:var(--text3);margin-top:8px}
@container (max-width:640px){
  .iv-body{grid-template-columns:1fr}
  .iv-step span{display:none}
  .iv-head .r{text-align:left}
}

/* ---------- Facturiers (exercice Plume, partie a) ---------- */
.fact{background:#fbfaf5;color:var(--ink);border-radius:14px;border:1px solid #e3dfd2;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;margin-bottom:14px}
.fact h4{margin:0;padding:10px 14px;background:#6b3fa0;color:#fff;font-size:.95rem;display:flex;justify-content:space-between;gap:10px}
.fact table{width:100%;border-collapse:collapse;font-size:.88rem}
.fact th{text-align:left;font-size:.76rem;color:#5b6478;font-weight:700;padding:7px 10px;border-bottom:1px solid #e8e3d4;background:#f4f1e7}
.fact th.num,.fact td.num{text-align:right}
.fact td{padding:8px 10px;border-bottom:1px solid #ece8dc;vertical-align:middle}
.fact td.num{font-family:'Space Mono',monospace;white-space:nowrap;font-size:.84rem}
.fact td.ref{font:700 .82rem 'Space Mono',monospace;color:#6b3fa0;width:34px}
.fact .msel{background:#fff;color:#1d2433;border-color:#c9cfda;min-width:178px}
.fact tr.ok .msel{border-color:#16a34a;background:#effaf3;color:#0f6b33}
.fact tr.ok2 .msel{border-color:#ea8a0c;background:#fff6e9;color:#8a4b00}
.fact tr.ko .msel{border-color:#dc2645;background:#fdeef1;color:#a1122e}
.fact .fixline{color:#c8183a}
.fact .foot{padding:8px 14px;font-size:.8rem;color:#5b6478}

/* ---------- Documents papier (factures, notes de crédit) ---------- */
.doc{background:#fff;color:var(--ink);border-radius:10px;padding:16px 18px;box-shadow:0 16px 44px rgba(0,0,0,.4);font-size:.84rem;position:relative;max-width:600px;margin:14px auto 18px;transform:rotate(-.35deg);line-height:1.45}
.doc::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,0) 60%,rgba(0,0,0,.035))}
.doc-head{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #1d2433;padding-bottom:10px;margin-bottom:10px}
.doc-firm{display:flex;gap:10px;align-items:flex-start}
.doc-firm svg{width:40px;height:40px;flex:none}
.doc-firm b{font-size:.98rem}
.doc-type{text-align:right;font:900 1.05rem 'Outfit',sans-serif;letter-spacing:.04em}
.doc-type span{display:block;font:500 .78rem 'Space Mono',monospace;letter-spacing:0;color:var(--ink2)}
.doc-type.nc{color:#b4234a}
.doc-type.inv{color:#1f5fa8}
.doc-to{background:#f4f6fa;border-radius:6px;padding:6px 10px;margin-bottom:10px}
.doc table{width:100%;border-collapse:collapse}
.doc th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);text-align:left;border-bottom:1px solid #d5dbe6;padding:5px 4px}
.doc td{padding:6px 4px;border-bottom:1px solid #eef0f5}
.doc .num{text-align:right;font-family:'Space Mono',monospace;white-space:nowrap}
.doc-tot{display:flex;justify-content:flex-end;gap:18px;margin-top:8px;font-weight:800}
.doc-tot .mono{font-size:.95rem}
.doc-mention{margin-top:10px;font-size:.76rem;border:1px dashed #9aa3b5;border-radius:6px;padding:6px 8px;color:#4b5568}
.doc-peppol{position:absolute;top:-10px;right:14px;background:#0f6b5a;color:#fff;font:800 .66rem 'Outfit',sans-serif;letter-spacing:.08em;padding:3px 8px;border-radius:99px}

/* ---------- Bilans ---------- */
.medal{font-size:4.4rem;text-align:center;line-height:1.1;animation:pop .7s}
.grade{display:inline-block;font:900 1.1rem 'Outfit',sans-serif;padding:4px 14px;border-radius:99px;background:rgba(139,92,246,.18);border:1px solid var(--violet);color:#d6c9ff}
.bstars{font-size:2rem;letter-spacing:6px;color:var(--gold);text-align:center}
.bstars .off{color:var(--border2)}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.85rem;color:var(--text2);margin:10px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.tri div{border-radius:12px;padding:12px;text-align:center;background:var(--bg3);border:1px solid var(--border)}
.tri b{display:block;font-size:1.6rem}
.tri .c{border-color:rgba(34,214,138,.45)} .tri .c b{color:var(--accent)}
.tri .h{border-color:rgba(255,138,61,.45)} .tri .h b{color:var(--orange)}
.tri .s{border-color:rgba(255,77,109,.45)} .tri .s b{color:var(--error)}
.qlist{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.qlist li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);font-size:.92rem}
.qlist li .pts{margin-left:auto;font:700 .85rem 'Space Mono',monospace;color:var(--text2);white-space:nowrap}
.recap{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
.recap th{font-size:.78rem;color:var(--text3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.recap td{padding:8px;border-bottom:1px solid var(--border)}
.recap td.c,.recap th.c{text-align:center}
.crit{border-radius:14px;border:1px solid var(--border);padding:14px 16px;margin:12px 0;background:var(--bg3)}
.crit h4{margin:0;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.crit.atteint{border-color:rgba(34,214,138,.55)}
.crit.encours{border-color:rgba(255,138,61,.55)}
.crit.nonatteint{border-color:rgba(255,77,109,.55)}
.ind{padding:10px 0 2px;border-top:1px solid var(--border);margin-top:10px}
.ind .row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.st{font-size:.76rem;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st.atteint{background:rgba(34,214,138,.15);color:var(--accent)}
.st.encours{background:rgba(255,138,61,.15);color:var(--orange)}
.st.nonatteint{background:rgba(255,77,109,.15);color:var(--error)}
.revoir{font-size:.88rem;color:var(--text2);margin-top:6px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.03)}
.final-hero{text-align:center}
.final-hero h2{font-size:clamp(1.4rem,3.6vw,2rem)}

/* ---------- Fiches imprimables (fond clair) ---------- */
.fiche{background:#fff;color:#1d2433;border-radius:14px;padding:22px;margin:16px 0;box-shadow:var(--shadow)}
.fiche h3{color:#6b3fa0;margin-bottom:.3em}
.fiche .fi-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid #6b3fa0;padding-bottom:10px;margin-bottom:12px}
.fiche table{width:100%;border-collapse:collapse;font-size:.88rem}
.fiche td,.fiche th{padding:6px 8px;border-bottom:1px solid #e3e7ef;text-align:left;vertical-align:top}
.fiche .num{text-align:right;font-family:'Space Mono',monospace;white-space:nowrap}
.fiche .crit{background:#f7f8fb;border-color:#d5dbe6}
.fiche .ind{border-top-color:#e3e7ef}
.fiche .revoir{background:#f3f0fa;color:#3b3156}
.fiche .st.atteint{background:#e3f7ec;color:#0f6b33}
.fiche .st.encours{background:#fff1df;color:#8a4b00}
.fiche .st.nonatteint{background:#fde6ea;color:#a1122e}
.fiche .pg{font-size:.7rem}
.accuse{position:relative}
.stamp{align-self:center;transform:rotate(-8deg);border:3px solid #16a34a;color:#16a34a;font:900 .95rem 'Outfit',sans-serif;padding:5px 10px;border-radius:8px;letter-spacing:.08em;background:rgba(255,255,255,.85);white-space:nowrap}
.accuse .mk{font-size:.75rem;margin-left:4px}
.pieges{counter-reset:pg;list-style:none;padding:0;margin:0}
.pieges li{counter-increment:pg;position:relative;padding:8px 8px 8px 40px;border-bottom:1px solid #e3e7ef}
.pieges li::before{content:counter(pg);position:absolute;left:6px;top:8px;width:24px;height:24px;border-radius:50%;background:#6b3fa0;color:#fff;font-weight:800;font-size:.8rem;display:grid;place-items:center}

/* ---------- Aide-mémoire (tiroir) ---------- */
.drawer-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:299;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-ov.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--bg2);border-left:1px solid var(--border);z-index:300;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.drawer-h h3{margin:0;font-size:1.1rem}
.dtabs{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--border);flex:none}
.dtab{white-space:nowrap;padding:7px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font:600 .85rem 'Outfit',sans-serif}
.dtab.on{background:var(--violet);color:#fff;border-color:var(--violet)}
.dbody{flex:1;overflow:auto;padding:14px 16px 30px}
.mtab{width:100%;border-collapse:collapse;font-size:.88rem;margin-bottom:12px}
.mtab td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.mtab td:first-child{width:46px}
.mtab tr.grp td{background:rgba(139,92,246,.10);font-weight:700;color:#c4b2ff;font-size:.84rem}

/* ---------- Effets ---------- */
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden}
.particle{position:absolute;width:8px;height:8px;border-radius:50%;margin:-4px 0 0 -4px;animation:burst .8s ease-out forwards}
.xpfloat{position:absolute;font:900 1.25rem 'Outfit',sans-serif;color:var(--gold);text-shadow:0 2px 12px rgba(0,0,0,.6);animation:floatUp 1.15s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
.combo{position:fixed;top:32%;left:50%;font:900 clamp(1.6rem,6vw,3rem) 'Outfit',sans-serif;color:var(--orange);text-shadow:0 0 30px rgba(255,138,61,.7);animation:comboIn 1.25s forwards;z-index:501;pointer-events:none;white-space:nowrap}
.confetti{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
#toastZone{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,92vw)}
.toast{display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:16px;background:linear-gradient(135deg,#2b1d4f,#16213d);border:1px solid var(--violet);box-shadow:0 14px 40px rgba(0,0,0,.55);animation:toastIn .4s,toastOut .4s 2.7s forwards;width:100%}
.toast .ic{font-size:2.1rem}
.toast small{display:block;color:var(--text2)}
.rankup{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;overflow:hidden;padding:16px}
.rays{position:absolute;width:1000px;height:1000px;left:50%;top:50%;margin:-500px 0 0 -500px;background:repeating-conic-gradient(from 0deg,rgba(255,197,61,.14) 0 9deg,transparent 9deg 18deg);border-radius:50%;animation:spin 20s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 62%);mask-image:radial-gradient(circle,#000 18%,transparent 62%)}
.rankcard{position:relative;background:linear-gradient(160deg,#21184a,#0f1a33);border:1px solid var(--gold);border-radius:24px;padding:30px 34px;text-align:center;animation:pop .6s;max-width:420px;box-shadow:0 0 60px rgba(255,197,61,.25)}
.rankcard .big{font-size:4.5rem;line-height:1.1}
.rankcard h2{font-size:1.7rem;margin:.2em 0}

/* ---------- Modals (identification, classement) ---------- */
.modal-ov{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.75);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:28px;width:100%;max-width:440px;animation:slideUp .35s;box-shadow:0 0 40px rgba(0,0,0,.5);position:relative;text-align:center}
.modal.lb{max-width:620px;max-height:86vh;overflow-y:auto;text-align:left}
.modal input[type=email]{width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:1rem;outline:none;margin-bottom:10px;font-family:inherit}
.modal input[type=email]:focus{border-color:var(--violet)}
.modal .err{color:#ff4060;font-size:.84rem;margin-bottom:10px;min-height:1.2em}
.modal .x{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer}
.lbtabs{display:flex;gap:8px;margin-bottom:16px}
.lbtabs button{flex:1;padding:10px;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.85rem}

/* ---------- Animations ---------- */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(255,197,61,.45)}50%{box-shadow:0 0 0 12px rgba(255,197,61,0)}}
@keyframes shimmer{to{transform:translateX(100%)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.12) translateY(-4px)}60%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-260%)}}
@keyframes comboIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(2deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.95)}}
@keyframes toastIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(20px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.screen-in{animation:slideUp .35s}

/* ---------- Responsive ---------- */
@media (max-width:1023px){
  .ws{grid-template-columns:1fr}
  .ws-tabs{display:flex;gap:6px;position:sticky;top:calc(var(--hud-h) + 6px);z-index:20;background:rgba(13,19,34,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--border2);border-radius:14px;padding:5px;margin-bottom:12px}
  .ws-tabs button{flex:1;padding:10px;border-radius:10px;border:0;background:transparent;color:var(--text2);font:700 .95rem 'Outfit',sans-serif;cursor:pointer}
  .ws-tabs button.on{background:var(--violet);color:#fff}
  .ws[data-tab="main"] .ws-dossier{display:none}
  .ws[data-tab="dossier"] .ws-main{display:none}
  .ws-dossier{position:static}
  .dossier{max-height:none}
}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .hero-art{order:-1;max-width:520px;margin:0 auto}
  .stats{grid-template-columns:repeat(3,1fr)}
  .zones{grid-template-columns:1fr}
  .zone{min-height:auto}
  .company{grid-template-columns:1fr}
  .company svg{max-width:360px;margin:0 auto}
  .cdo{grid-template-columns:1fr 1fr}
  .cdo > :not(.cdo-box){display:none}
  .cdo-box.c2{grid-area:1 / 1} .cdo-box.c4{grid-area:1 / 2} .cdo-box.c3{grid-area:2 / 1} .cdo-box.c5{grid-area:2 / 2} .cdo-box.c6{grid-area:3 / 1 / 4 / 3}
  .trophies{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:768px){
  .mtable,.mtable tbody,.mtable tr,.mtable td{display:block;width:100%!important}
  .mtable{border-spacing:0}
  .mtable tr{margin-bottom:10px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .mtable td{border:0!important;border-radius:0!important;padding:8px 12px}
  .mtable td:first-child{text-align:left}
  .fact table,.fact tbody,.fact tr,.fact td{display:block;width:100%}
  .fact thead{display:none}
  .fact h4 span:last-child{display:none}
  .fact tr{padding:10px 12px;border-bottom:1px solid #e3dfd2;display:grid;grid-template-columns:34px repeat(3,1fr);gap:2px 8px}
  .fact td{border:0;padding:2px 0}
  .fact td.ref{grid-row:1 / 3}
  .fact td.lab{grid-column:2 / 5;font-weight:600}
  .fact td.num{text-align:left;grid-column:auto}
  .fact td.num::before{content:attr(data-l) " ";display:block;font-family:'Outfit',sans-serif;color:#5b6478;font-size:.7rem}
  .fact td.sel{grid-column:1 / 5;margin-top:6px}
  .fact .msel{min-width:0}
  .soldes{grid-template-columns:1fr}
}
@media (max-width:600px){
  .dz-table thead{display:none}
  .dz-table,.dz-table tbody,.dz-table tr{display:block;width:100%}
  .dz-table tr{display:grid;grid-template-columns:30px repeat(3,1fr);gap:0 8px;padding:8px 10px;border-bottom:1px solid #ece8dc}
  .dz-table td{border:0;padding:1px 0}
  .dz-table td.ref{grid-row:1 / 4}
  .dz-table td.lab{grid-column:2 / 5;font-weight:600}
  .dz-table td.num{text-align:left}
  .dz-table td.num::before{content:attr(data-l) " ";display:block;font-family:'Outfit',sans-serif;color:#5b6478;font-size:.7rem}
  .dz-table td.grids{grid-column:2 / 5;min-width:0;margin-top:4px}
}
.xp-mini{display:none;white-space:nowrap;color:var(--text2)}
.xp-mini b{color:var(--text)}
@media (max-width:560px){
  .hud-in{gap:6px;padding:6px 10px 4px}
  .logo svg{width:30px;height:30px}
  .logo-t{display:none}
  .lvpills{gap:4px}
  .lvpill{width:25px;height:25px;font-size:.7rem}
  #chipStreak,#chipXp{display:none}
  .chip{padding:4px 7px;font-size:.74rem}
  .hud-chips{gap:5px}
  .icbtn{width:32px;height:32px;font-size:.9rem;border-radius:9px}
  .xpbar{padding:0 10px 7px;gap:8px;font-size:.74rem}
  .xp-mini{display:block}
  .xp-next{display:none}
}
@media (max-width:480px){
  .logo-t{display:none}
  .qm-t{display:none}
  .qprompt{font-size:1.02rem}
  .chip{padding:5px 8px;font-size:.8rem}
  .icbtn{width:34px;height:34px;font-size:.95rem}
  .xp-next{display:none}
  #main{padding:16px 12px 80px}
  .card{padding:16px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:last-child{grid-column:1 / -1}
  .predict{grid-template-columns:1fr}
  .path::before{left:28px}
  .pnode{grid-template-columns:56px 1fr;gap:12px}
  .pnode .dot{grid-column:1}
  .pnode .lvcard,.pnode.r .lvcard{grid-column:2}
  .vf{grid-template-columns:1fr 1fr}
  .brief-head{align-items:flex-start}
  .brief-ic{width:52px;height:52px;font-size:1.6rem}
  .trophies{grid-template-columns:repeat(2,1fr)}
  .tri b{font-size:1.3rem}
  .notebook{padding-left:36px}
  .notebook::before{left:24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media print{
  body{background:#fff!important}
  body::before,body::after{display:none}
  body *{visibility:hidden}
  .print-target,.print-target *{visibility:visible}
  .print-target{position:absolute;left:0;top:0;width:100%;box-shadow:none!important;margin:0!important;transform:none!important}
  .no-print{display:none!important}
}

<!-- ===== HUD permanent ===== -->

  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="emailTitle">

<script>
"use strict";
/* =====================================================================
   DONNÉES PÉDAGOGIQUES — cours « La TVA : déclaration et centralisation »
   Partie 1 (pages 1 à 13) · 6e Technicien en comptabilité
   ===================================================================== */

/* ---------- Critères et indicateurs (bilan final, CONVENTIONS §4.11) ---------- */
const CRITERES = [
  { id:'C1', nom:'Situer la déclaration : régime, échéances et dépôt', indicateurs:[
    { id:'I1', texte:'Je choisis entre le régime mensuel et le régime trimestriel en connaissant leurs conditions',
      sauras:'choisir entre le régime mensuel et le régime trimestriel',
      chapitre:'Avant de commencer…', sections:[],
      revoir:'les deux régimes, leurs conditions (2 500 000 € HTVA) et l’encadré « Réfléchis ! » sur la TVA à récupérer' },
    { id:'I2', texte:'Je respecte les échéances et je décris le dépôt dans Intervat, paiement et remboursement compris',
      sauras:'fixer la date limite d’une déclaration et la déposer dans Intervat',
      chapitre:'La déclaration périodique', sections:['La déclaration en ligne : Intervat'],

const DECALAGE = [2,0,3,1, 1,3,0,2, 3,1,2,0, 0,2,1,3, 2,3,0,1];
(function melangerPropositions(liste){
  let k = 0;
  liste.forEach(q => {
    if (q.type !== 'qcm') return;
    const t = DECALAGE[k++ % DECALAGE.length];
    for (let n = 0; n < t; n++) { q.options.unshift(q.options.pop()); q.correct = (q.correct + 1) % q.options.length; }
  });
})(LEVELS.flatMap(lv => lv.questions));

}

/* Typographie française : espaces insécables avant : ; ! ? % € » et dans les milliers */
function T(s){
  if (s == null) return '';
  return String(s)
    .replace(/(\d) (?=\d{3}(?!\d))/g, '$1 ')
    .replace(/ ([:;!?%€»])/g, ' $1')
    .replace(/« /g, '« ');
}
function fmt(n){
  if (n === null || n === undefined || n === '' || isNaN(n)) return '';
  const neg = n < 0; let [i, d] = Math.abs(n).toFixed(2).split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '−' : '') + i + ',' + d;
}

/* ---------- Mini-calculatrice (CONVENTIONS §6) ----------
   Liste blanche stricte. Accepte « 1 150 000 », « 326,75 », « 4.100 » (milliers) et les calculs. */
function normNum(t){
  t = t.replace(/[\s  €]/g, '');
  if (t.includes(',')) return t.replace(/\./g, '').replace(',', '.');
  if (/^\d{1,3}(\.\d{3})+$/.test(t)) return t.replace(/\./g, '');
  return t;
}
function evalExpr(s){
  let e = String(s).replace(/[\s  €]/g, '').replace(/[×xX]/g, '*').replace(/÷/g, '/').replace(/[−–]/g, '-').replace(/%/g, '/100');
  if (!/[+\-*/]/.test(e.slice(1))) return null;
  e = e.split(/([+\-*/()])/).map(tok => /[+\-*/()]/.test(tok) || tok === '' ? tok : normNum(tok)).join('');
  if (!/^[0-9+\-*/().]+$/.test(e)) return null;
  try { const r = Function('"use strict";return (' + e + ')')(); return (typeof r === 'number' && isFinite(r)) ? Math.round(r * 100) / 100 : null; }
  catch (err) { return null; }
}
function parseNum(s){
  if (s === null || s === undefined) return null;
  s = String(s).trim(); if (!s) return null;
  const r = evalExpr(s); if (r !== null) return r;
  const v = parseFloat(normNum(s.replace(/[−–]/g, '-')));
  return isNaN(v) ? null : v;
}
function calcPreview(s){
  const r = evalExpr(s || '');
  if (r === null) return '';
  return esc(String(s).replace(/\*/g, '×').replace(/\//g, '÷')) + ' → = ' + fmt(r);
}

/* ---------- Mélange déterministe (jamais Math.random pour l’ordre) ---------- */
function shuffled(n, seed){
  const a = [...Array(n).keys()]; let s = seed;
  for (let i = n - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function getQ(l, q){ const raw = LEVELS[l].questions[q]; return raw.variants ? Object.assign({}, raw, raw.variants[APP.scenario]) : raw; }
function key(l, q){ return l + '_' + q; }
function S(l, q){ const k = key(l, q); return APP.qs[k] || (APP.qs[k] = initState(getQ(l, q), l, q)); }

function matchRows(Q){
  if (Q.layout === 'facturier') return COMPANIES[Q.company].ops.map(o => ({ k:o.ref, t:o.label, a:PLUME_COMBO[o.ref], set:o.side, op:o }));
  return Q.rows;
}
function nElems(Q){
  switch (Q.type) {
    case 'zones': return Q.items.length;
    case 'match': return matchRows(Q).length;
    case 'order': return Q.steps.length;
    case 'cloze': return Q.blanks.length;
    case 'hunt': return Q.items.filter(i => i.wrong).length;
    case 'intervat': return Object.keys(Q.exp).length;
  }
  return 1;
}
function initState(Q, l, q){
  const s = { attempts:0, done:false, status:null, earned:0, first:0, fb:null, bounce:{}, lock:{} };
  const seed = l * 31 + q * 7 + 11;
  switch (Q.type) {
    case 'qcm': s.sel = null; s.tried = []; break;
    case 'multi': s.sel = []; s.order = shuffled(Q.options.length, seed); break;
    case 'num': s.val = ''; break;
    case 'vf': s.sel = null; break;
    case 'zones': s.place = {}; s.pick = null; s.order = shuffled(Q.items.length, seed); break;
    case 'match': s.val = {}; break;
    case 'order': s.slot = Array(Q.steps.length).fill(null); s.pick = null; s.bank = shuffled(Q.steps.length + Q.distractors.length, seed); break;
    case 'cloze': s.fill = {}; s.pick = null; s.bank = shuffled(Q.blanks.length + Q.distractors.length, seed); break;
    case 'hunt': s.flag = {}; s.raw = 0; s.firstRaw = 0; s.fa = 0; s.fa1 = 0; s.faMark = {}; break;
    case 'intervat': s.val = {}; s.extra = {}; s.warned = false; s.focus = null; break;
  }
  return s;
}

/* ---------- Score (toujours recalculé : somme des points = score) ---------- */
function recomputeScore(){ let t = 0; for (const k in APP.qs) t += APP.qs[k].earned || 0; APP.score = Math.round(t * 100) / 100; }
function levelEarned(l){ return LEVELS[l].questions.reduce((t, _, i) => t + ((APP.qs[key(l, i)] && APP.qs[key(l, i)].earned) || 0), 0); }
function levelStats(l){
  const lv = LEVELS[l]; let c = 0, h = 0, sh = 0, earned = 0, first = 0;
  lv.questions.forEach((Q, i) => { const s = APP.qs[key(l, i)]; if (!s) return; earned += s.earned; first += s.first;
    if (s.status === 'correct') c++; else if (s.status === 'hint') h++; else if (s.status === 'shown') sh++; });
  const n = lv.questions.length;
  return { c, h, sh, n, earned, first, max:lv.maxPoints, ratio:earned / lv.maxPoints, firstPct:first / lv.maxPoints, firstQ:c / n };
}
function globalStats(){
  let c = 0, h = 0, sh = 0, n = 0, first = 0, earned = 0;
  LEVELS.forEach((lv, l) => { const st = levelStats(l); c += st.c; h += st.h; sh += st.sh; n += st.n; first += st.first; earned += st.earned; });
  return { c, h, sh, n, first, earned, firstPct:first / TOTAL_XP, ratio:earned / TOTAL_XP };
}

/* ---------- Sons Web Audio : coupés par défaut (CONVENTIONS §4.10) ---------- */
let AC = null;
function tone(freq, start, dur, type, vol){
  if (!APP.soundOn) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + start, o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || .14, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .05);
  } catch (e) {}
}
const SND = {
  ok(){ tone(660, 0, .12, 'triangle'); tone(990, .1, .18, 'triangle'); },
  err(){ tone(196, 0, .2, 'sawtooth', .05); },
  badge(){ tone(784, 0, .14); tone(988, .12, .14); tone(1319, .24, .26); },
  level(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .11, .22, 'triangle')); }
};

/* ---------- Après chaque vérification ---------- */
function afterCheck(l, q, prevEarned, firstOk, hadError){
  const s = S(l, q);
  recomputeScore();
  const delta = s.earned - prevEarned;
  if (delta > 0) { burst(APP.lastPointer.x, APP.lastPointer.y); floatXP(APP.lastPointer.x, APP.lastPointer.y, delta); SND.ok(); }
  if (firstOk === true) { APP.streak++; APP.bestStreak = Math.max(APP.bestStreak, APP.streak); comboFlash(APP.streak); if (APP.streak >= 5) award('streak5'); }
  else if (firstOk === false) { APP.streak = 0; }
  if (hadError) { APP.fx.shake = true; SND.err(); }
  const r = rankIndex(APP.score);
  if (r > APP.rankIdx) { queueSpectacle({ type:'rank', idx:r }); APP.rankIdx = r; }   /* un seul écran, même si deux paliers sont franchis */
  if (s.done) onQuestionDone(l, q);
  save(); renderScreen();
  if (s.done || hadError) setTimeout(() => { const fb = document.querySelector('.fb'); if (fb) fb.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block:'nearest' }); }, 60);
}
function onQuestionDone(l, q){
  const Q = getQ(l, q), s = S(l, q);
  if (Q.type === 'hunt' && s.status === 'correct' && s.fa === 0) award('hunter');
  if (Q.type === 'intervat' && Q.company === 'plume' && s.status === 'correct') award('intervat');
  const lv = LEVELS[l];
  if (lv.questions.every((_, i) => APP.qs[key(l, i)] && APP.qs[key(l, i)].done)) completeLevel(l);
}
function predOutcome(r){ return r >= .999 ? 'all' : r >= .625 ? 'tq' : 'half'; }
function completeLevel(l){
  if (APP.completed.includes(l)) return;
  APP.completed.push(l);
  /* Tracking : anti-doublon + chronomètre + envoi (SPEC v5 §15.6) */
  if (!APP.completedExercises.includes(l)) {
    APP.completedExercises.push(l);
    const res = stopExerciseTimer(l);
    if (res) sendResult(LEVELS[l].trackName, res.points, LEVELS[l].maxPoints, res.temps);
  }
  const st = levelStats(l);
  if (l === 0) award('m1');
  if (st.firstPct >= .999) award('perfect');
  if (APP.predictions[l] && APP.predictions[l] === predOutcome(st.firstQ)) award('lucid');
  if (allDone()) { award('all'); if (APP.score / TOTAL_XP >= .85) award('master'); }
  setTimeout(() => SND.level(), 300);
}
