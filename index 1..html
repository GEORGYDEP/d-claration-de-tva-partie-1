  const s = loadSave();
  if (s && s.email === APP.email && Date.now() - s.t < 12 * 3600 * 1000 && (s.completed.length || Object.keys(s.qs).length)) {
    APP.resumeOffer = s;
  } else APP.resumeOffer = null;
}
function resumeGame(){
  const s = APP.resumeOffer; if (!s) return;
  Object.assign(APP, { qs:s.qs, completed:s.completed, completedExercises:s.completedExercises, levelPos:s.levelPos, predictions:s.predictions,
    badges:s.badges, streak:s.streak, bestStreak:s.bestStreak, rankIdx:s.rankIdx, resumeOffer:null });
  if (s.sessionId) TRACKING.sessionId = s.sessionId;
  recomputeScore(); updateHUD(); setScreen('hub');
}
function declineResume(){ APP.resumeOffer = null; store.del(SAVE_KEY); renderScreen(); }
function resetState(){
  Object.assign(APP, { level:null, q:0, qs:{}, score:0, streak:0, bestStreak:0, completed:[], levelPos:{}, predictions:{}, badges:[], rankIdx:0,
    exerciseStartTime:{}, exerciseTimes:{}, exerciseScores:{}, scoreBeforeExercise:{}, completedExercises:[], resumeOffer:null });
}
function restartGame(){
  TRACKING.sessionId = new Date().toISOString();   /* ⚠️ nouvelle session (SPEC v5) */
  resetState(); store.del(SAVE_KEY);
  APP.globalTimerStart = Date.now();
  updateHUD(); setScreen('hub');
}

/* ---------- Impression d’une fiche précise ---------- */
function printEl(id){
  const el = document.getElementById(id); if (!el) return;
  document.querySelectorAll('.print-target').forEach(x => x.classList.remove('print-target'));
  el.classList.add('print-target');
  window.print();
  setTimeout(() => el.classList.remove('print-target'), 500);
}
function studentName(){
  if (!APP.email) return 'Élève';
  return APP.email.split('@')[0].split(/[._-]/).filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
function todayFR(){ return new Date().toLocaleDateString('fr-BE', { day:'2-digit', month:'2-digit', year:'numeric' }); }
/* =====================================================================
   TYPES D’EXERCICES — rendu + correction
   2 essais (indice socratique au 1er échec), V/F en 1 essai,
   exercices à éléments : verrouillage progressif et barème par élément.
   ===================================================================== */
const TYPE_LABEL = { qcm:'QCM', vf:'Vrai / Faux', multi:'Sélection multiple', num:'Réponse à écrire', zones:'Classement', match:'Appariement',
  order:'Remise en ordre', cloze:'Texte à trous', hunt:'Chasse aux erreurs', intervat:'Écran Intervat' };
const ELEM_TYPES = ['zones','match','order','cloze','hunt','intervat'];

/* ---------- Prêt à vérifier ? ---------- */
function isReady(Q, s){
  if (s.done) return false;
  switch (Q.type) {
    case 'qcm': return s.sel !== null;
    case 'multi': return s.sel.length > 0;
    case 'num': return parseNum(s.val) !== null;
    case 'zones': return Q.items.every((_, i) => s.lock[i] || s.place[i] !== undefined);
    case 'match': return matchRows(Q).every((_, i) => s.lock[i] || s.val[i]);
    case 'order': return s.slot.every((b, k) => s.lock[k] || b !== null);
    case 'cloze': return Q.blanks.every((_, k) => s.lock[k] || (s.fill[k] !== undefined && s.fill[k] !== null));
    case 'hunt': return Q.items.some((_, i) => !s.lock[i] && s.flag[i]);
    case 'intervat':
      if (Q.guided) return Object.keys(Q.exp).every(g => s.lock[g] || (s.val[g] || '').trim());
      return ALL_GRIDS.some(g => !s.lock[g] && (s.val[g] || '').trim());
  }
  return false;
}
function updateCheckBtn(){ const b = $('#checkBtn'); if (b) b.disabled = !isReady(curQ(), curS()); }

/* ---------- Correction générique des exercices à éléments (CONVENTIONS §3.8) ---------- */
function itemCheck(l, q, Q, s, ids, isOk, reset){
  const n = nElems(Q), per = Q.pts / n, prev = s.earned;
  s.attempts++;
  let okNow = 0, wrong = 0;
  ids.forEach(id => {
    if (isOk(id)) { s.lock[id] = s.attempts === 1 ? 'ok' : 'ok2'; s.earned += s.attempts === 1 ? per : per / 2; if (s.attempts === 1) s.first += per; okNow++; }
    else if (s.attempts === 1) { reset(id); wrong++; }
    else { s.lock[id] = 'ko'; wrong++; }
  });
  s.earned = Math.round(s.earned * 100) / 100; s.first = Math.round(s.first * 100) / 100;
  if (s.attempts >= 2 || wrong === 0) {
    s.done = true;
    const v = Object.values(s.lock);
    s.status = v.every(x => x === 'ok') ? 'correct' : v.includes('ko') ? 'shown' : 'hint';
  }
  const okTotal = Object.values(s.lock).filter(x => x === 'ok' || x === 'ok2').length;
  s.fb = { okNow, wrong, okTotal, total:n };
  afterCheck(l, q, prev, s.attempts === 1 ? wrong === 0 : undefined, wrong > 0);
}

/* ---------- QCM ---------- */
function rQcm(Q, s){
  return `<div class="opts" role="radiogroup" aria-label="Propositions">${Q.options.map((o, i) => {
    let c = 'opt';
    if (s.tried.includes(i)) c += ' bad';
    if (s.done && i === Q.correct) c += ' good';
    if (!s.done && s.sel === i) c += ' sel';
    const dis = s.done || s.tried.includes(i);
    return `<button class="${c}" data-fk="o${i}" ${dis ? 'disabled' : ''} role="radio" aria-checked="${s.sel === i}" onclick="qcmPick(${i})"><span class="ol">${'ABCD'[i]}</span><span>${T(o)}</span></button>`;
  }).join('')}</div>`;
}
function qcmPick(i){ const s = curS(); if (s.done || s.tried.includes(i)) return; s.sel = i; renderScreen(); }
function checkSingle(l, q, Q, s, ok){
  const prev = s.earned; s.attempts++;
  if (ok) { s.done = true; s.status = s.attempts === 1 ? 'correct' : 'hint'; s.earned = s.attempts === 1 ? Q.pts : Q.pts / 2; if (s.attempts === 1) s.first = Q.pts; s.fb = 'ok'; }
  else if (s.attempts >= 2) { s.done = true; s.status = 'shown'; s.fb = 'shown'; }
  else s.fb = 'hint';
  afterCheck(l, q, prev, s.attempts === 1 ? ok : undefined, !ok);
}
function checkQcm(l, q, Q, s){ const ok = s.sel === Q.correct; if (!ok) { s.tried.push(s.sel); s.sel = null; } checkSingle(l, q, Q, s, ok); }

/* ---------- Sélection multiple ---------- */
function rMulti(Q, s){
  return `<div class="opts">${s.order.map(i => {
    const on = s.sel.includes(i), isC = Q.correct.includes(i);
    let c = 'opt', mark = on ? '✓' : '';
    if (s.done) { if (isC && on) c += ' good'; else if (isC) { c += ' miss'; mark = ''; } else if (on) c += ' bad'; }
    else if (on) c += ' sel';
    const tail = s.done && isC && !on ? ' <span class="small" style="color:var(--accent)">(à cocher aussi)</span>' : '';
    return `<button class="${c}" data-fk="m${i}" ${s.done ? 'disabled' : ''} role="checkbox" aria-checked="${on}" onclick="multiToggle(${i})"><span class="box2">${mark}</span><span>${T(Q.options[i])}${tail}</span></button>`;
  }).join('')}</div>`;
}
function multiToggle(i){ const s = curS(); if (s.done) return; const k = s.sel.indexOf(i); if (k >= 0) s.sel.splice(k, 1); else s.sel.push(i); renderScreen(); }
function checkMulti(l, q, Q, s){ checkSingle(l, q, Q, s, s.sel.length === Q.correct.length && Q.correct.every(i => s.sel.includes(i))); }

/* ---------- Réponse à écrire (avec mini-calculatrice) ---------- */
function rNum(Q, s){
  const soldes = Q.soldes ? `<div class="soldes">${Q.soldes.map(([k, lab, v, dc]) => `<div class="solde ${k}">${T(lab)} :<span class="mono">${fmt(v)} € (${dc})</span></div>`).join('')}</div>` : '';
  const cls = s.done ? (s.status === 'shown' ? ' ko' : ' ok') : '';
  return `${soldes}<label for="numIn" style="display:block;font-weight:700;margin-bottom:6px">${T(Q.label)}</label>
<div class="numrow"><input id="numIn" class="numin${cls}" data-fk="num" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(s.val)}" ${s.done ? 'disabled' : ''} oninput="numInput(this)" onkeydown="if(event.key==='Enter')doCheck()" aria-describedby="calcPrev"><span class="unit">€</span></div>
<div class="calc" id="calcPrev" aria-live="polite">${calcPreview(s.val)}</div>${s.done ? '' : '<div class="small muted">Tu peux taper le résultat… ou le calcul (ex. 1500-320) : la mini-calculatrice l’affiche en direct.</div>'}`;
}
function numInput(el){ const s = curS(); s.val = el.value; $('#calcPrev').innerHTML = calcPreview(el.value); updateCheckBtn(); saveSoon(); }
function checkNum(l, q, Q, s){ const v = parseNum(s.val); if (v === null) return; checkSingle(l, q, Q, s, Math.abs(v - Q.answer) <= 0.02); }

/* ---------- Vrai / Faux (1 seul essai) ---------- */
function rVf(Q, s){
  const b = (val, lab, cls) => {
    let c = 'vfbtn ' + cls;
    if (s.done) { if (val === Q.answer) c += ' good'; else if (s.sel === val) c += ' bad'; }
    return `<button class="${c}" data-fk="vf${val}" ${s.done ? 'disabled' : ''} onclick="vfPick(${val})">${lab}</button>`;
  };
  return `<div class="statement">${T(Q.statement)}</div><div class="vf">${b(true, '✔ Vrai', 'v')}${b(false, '✘ Faux', 'f')}</div>${s.done ? '' : '<p class="small muted" style="margin-top:8px">Un seul essai pour le vrai/faux : réfléchis avant de cliquer.</p>'}`;
}
function vfPick(val){
  const l = APP.level, q = APP.q, Q = curQ(), s = curS(); if (s.done) return;
  const ok = val === Q.answer;
  s.sel = val; s.attempts = 1; s.done = true; s.status = ok ? 'correct' : 'shown';
  s.earned = ok ? Q.pts : 0; s.first = s.earned; s.fb = ok ? 'ok' : 'shown';
  afterCheck(l, q, 0, ok, !ok);
}

/* ---------- Classement par zones (clic-clic) ---------- */
function rZones(Q, s){
  const chip = i => {
    const it = Q.items[i], lk = s.lock[i];
    let c = 'tagi' + (lk ? ' ' + lk : '') + (s.pick === i ? ' pick' : '') + (s.bounce[i] ? ' bounce' : '');
    let fix = '';
    if (lk === 'ko') fix = `<span class="fix">→ ${T(Q.zones.find(z => z.id === it.z).label)} · ${T(it.why)}</span>`;
    else if (s.done) fix = `<span class="fix" style="color:var(--text3)">${T(it.why)}</span>`;
    return `<button class="${c}" data-fk="z${i}" ${lk || s.done ? 'disabled' : ''} onclick="event.stopPropagation();zPick(${i})">${lk ? '<span class="lk">🔒</span>' : ''}${T(it.t)}${fix}</button>`;
  };
  const pool = s.order.filter(i => s.place[i] === undefined);
  const zones = Q.zones.map(z => {
    const its = s.order.filter(i => s.place[i] === z.id);
    return `<div class="zone${s.pick !== null ? ' target' : ''}" role="button" tabindex="0" data-fk="zone${z.id}" aria-label="Ranger dans : ${esc(z.label)}" onclick="zDrop('${z.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();zDrop('${z.id}')}"><h5>${T(z.label)}</h5><small>${T(z.sub)}</small><div class="zitems">${its.map(chip).join('')}</div></div>`;
  }).join('');
  return `${s.done ? '' : `<div class="pool-title">Réserve — ${pool.length} étiquette(s)</div><div class="pool" onclick="zDeselect()">${pool.map(chip).join('')}</div>`}<div class="zones">${zones}</div>`;
}
function zPick(i){ const s = curS(); if (s.done || s.lock[i]) return; if (s.place[i] !== undefined) { delete s.place[i]; s.pick = i; } else s.pick = s.pick === i ? null : i; renderScreen(); }
function zDrop(z){ const s = curS(); if (s.done || s.pick === null) return; s.place[s.pick] = z; s.pick = null; renderScreen(); saveSoon(); }
function zDeselect(){ const s = curS(); if (s.pick !== null) { s.pick = null; renderScreen(); } }
function checkZones(l, q, Q, s){
  const ids = Q.items.map((_, i) => i).filter(i => !s.lock[i]);
  itemCheck(l, q, Q, s, ids, i => s.place[i] === Q.items[i].z, i => { delete s.place[i]; s.bounce[i] = 1; });
}

/* ---------- Appariement (listes déroulantes) ---------- */
function selHTML(i, opts, s, label, ph){
  const lk = s.lock[i];
  return `<select class="msel" data-fk="sel${i}" ${lk || s.done ? 'disabled' : ''} onchange="mSet(${i}, this.value)" aria-label="${esc(label)}"><option value="">${ph}</option>${opts.map(o => `<option value="${esc(o)}" ${s.val[i] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
}
function rMatch(Q, s){
  if (Q.layout === 'facturier') return rFacturier(Q, s);
  const rows = matchRows(Q);
  return `<table class="mtable"><tbody>${rows.map((r, i) => {
    const lk = s.lock[i];
    return `<tr class="mrow ${lk || ''} ${s.bounce[i] ? 'bounce' : ''}"><td>${esc(r.k)}</td><td>${T(r.t)}</td><td>${selHTML(i, Q.options, s, 'Grilles pour : ' + r.t, '— choisir HTVA → TVA —')}${lk === 'ko' ? `<span class="fixline">→ ${esc(r.a)}</span>` : ''}</td></tr>`;
  }).join('')}</tbody></table>`;
}
function rFacturier(Q, s){
  const co = COMPANIES[Q.company], rows = matchRows(Q);
  const table = (side, title) => {
    const idx = rows.map((r, i) => r.set === side ? i : -1).filter(i => i >= 0);
    return `<div class="fact"><h4><span>${title}</span><span>${esc(co.name)} · ${co.period}</span></h4><table><thead><tr><th>N°</th><th>Opération</th><th class="num">HTVA</th><th class="num">Taux</th><th class="num">TVA</th><th>Grilles</th></tr></thead><tbody>${idx.map(i => {
      const r = rows[i], o = r.op, lk = s.lock[i];
      return `<tr class="${lk || ''} ${s.bounce[i] ? 'bounce' : ''}"><td class="ref">${o.ref}</td><td class="lab">${T(o.label)}${o.star ? ' *' : ''}</td><td class="num" data-l="HTVA">${fmt(o.htva)}</td><td class="num" data-l="Taux">${o.rate ? T(o.rate) : '—'}</td><td class="num" data-l="TVA">${o.tva === null ? '—' : fmt(o.tva) + (o.star ? ' *' : '')}</td><td class="sel">${selHTML(i, Q.optionSets[side], s, 'Grilles pour ' + o.ref + ' : ' + o.label, '— grilles —')}${lk === 'ko' ? `<span class="fixline">→ ${esc(r.a)}</span>` : ''}</td></tr>`;
    }).join('')}</tbody></table>${side === 'E' ? '<div class="foot">* Prestataire assujetti dans un autre État de l’UE : c’est Plume &amp; Cie qui calcule la TVA belge (21 %).</div>' : ''}</div>`;
  };
  return table('S', 'Facturier de sortie') + table('E', 'Facturier d’entrée') + (s.done ? '' : '<p class="small muted">« 81 (−) » signifie : montant <b>déduit</b> de la grille 81.</p>');
}
function mSet(i, v){ const s = curS(); if (s.done || s.lock[i]) return; s.val[i] = v; updateCheckBtn(); saveSoon(); }
function checkMatch(l, q, Q, s){
  const rows = matchRows(Q), ids = rows.map((_, i) => i).filter(i => !s.lock[i]);
  itemCheck(l, q, Q, s, ids, i => s.val[i] === rows[i].a, i => { s.val[i] = ''; s.bounce[i] = 1; });
}

/* ---------- Remise en ordre ---------- */
function orderItem(Q, b){ return b < Q.steps.length ? Q.steps[b] : Q.distractors[b - Q.steps.length]; }
function rOrder(Q, s){
  const placed = new Set(s.slot.filter(x => x !== null));
  const slots = s.slot.map((b, k) => {
    const lk = s.lock[k], it = b !== null ? orderItem(Q, b) : null;
    const c = 'slot' + (b !== null ? ' filled' : '') + (lk ? ' ' + lk : '') + (s.pick !== null && !lk ? ' target' : '') + (s.bounce['s' + k] ? ' bounce' : '');
    const fix = lk === 'ko' ? `<span class="fixline">→ ${T(Q.steps[k].t)}</span>` : '';
    return `<button class="${c}" data-fk="slot${k}" ${lk || s.done ? 'disabled' : ''} onclick="oSlot(${k})"><span class="n">${k + 1}</span><span>${it ? SVG.ic[it.ic] + T(it.t) : '<span class="empty">Clique une étiquette, puis cette case</span>'}${fix}</span></button>`;
  }).join('');
  const bank = s.bank.filter(b => !placed.has(b)).map(b => { const it = orderItem(Q, b); return `<button class="tagi${s.pick === b ? ' pick' : ''}" data-fk="ob${b}" ${s.done ? 'disabled' : ''} onclick="oPick(${b})">${SVG.ic[it.ic]}${T(it.t)}</button>`; }).join('');
  return `<div class="slots">${slots}</div>${s.done ? '' : `<div class="pool-title">Étiquettes</div><div class="bank">${bank}</div>`}`;
}
function oPick(b){ const s = curS(); if (s.done) return; s.pick = s.pick === b ? null : b; renderScreen(); }
function oSlot(k){
  const s = curS(); if (s.done || s.lock[k]) return;
  if (s.pick !== null) { const from = s.slot.indexOf(s.pick); if (from >= 0) s.slot[from] = null; s.slot[k] = s.pick; s.pick = null; }
  else if (s.slot[k] !== null) s.slot[k] = null;
  renderScreen(); saveSoon();
}
function checkOrder(l, q, Q, s){
  const ids = s.slot.map((_, k) => k).filter(k => !s.lock[k]);
  itemCheck(l, q, Q, s, ids, k => s.slot[k] === k, k => { s.slot[k] = null; s.bounce['s' + k] = 1; });
}

/* ---------- Texte à trous ---------- */
function clozeWord(Q, b){ return b < Q.blanks.length ? Q.blanks[b] : Q.distractors[b - Q.blanks.length]; }
function rCloze(Q, s){
  const used = new Set(Object.values(s.fill).filter(x => x !== null && x !== undefined));
  const text = T(Q.text).replace(/\{(\d+)\}/g, (m, kk) => {
    const k = +kk, b = s.fill[k], lk = s.lock[k], has = b !== undefined && b !== null;
    const c = 'blank' + (has ? ' filled' : '') + (lk ? ' ' + lk : '') + (s.bounce['k' + k] ? ' bounce' : '');
    const fx = lk === 'ko' ? `<span class="fx">→ ${esc(Q.blanks[k])}</span>` : '';
    return `<button class="${c}" data-fk="bl${k}" ${lk || s.done ? 'disabled' : ''} onclick="cBlank(${k})" aria-label="Trou ${k + 1}${has ? ' : ' + esc(clozeWord(Q, b)) : ''}">${has ? esc(clozeWord(Q, b)) : '…'}${fx}</button>`;
  });
  const bank = s.bank.filter(b => !used.has(b)).map(b => `<button class="tagi${s.pick === b ? ' pick' : ''}" data-fk="w${b}" ${s.done ? 'disabled' : ''} onclick="cPick(${b})">${esc(clozeWord(Q, b))}</button>`).join('');
  return `<div class="cloze">${text}</div>${s.done ? '' : `<div class="pool-title">Banque de mots (3 intrus)</div><div class="bank">${bank}</div>`}`;
}
function cPick(b){ const s = curS(); if (s.done) return; s.pick = s.pick === b ? null : b; renderScreen(); }
function cBlank(k){
  const s = curS(); if (s.done || s.lock[k]) return;
  if (s.pick !== null) { for (const kk in s.fill) if (s.fill[kk] === s.pick) delete s.fill[kk]; s.fill[k] = s.pick; s.pick = null; }
  else if (s.fill[k] !== undefined) delete s.fill[k];
  renderScreen(); saveSoon();
}
function checkCloze(l, q, Q, s){
  const ids = Q.blanks.map((_, k) => k).filter(k => !s.lock[k]);
  itemCheck(l, q, Q, s, ids, k => s.fill[k] === k, k => { delete s.fill[k]; s.bounce['k' + k] = 1; });
}

/* ---------- Chasse aux erreurs (fausse alerte : −1 XP) ---------- */
function rHunt(Q, s){
  return `<div class="lucas">${SVG.lucas()}<div><b>Les notes de Lucas</b><div class="small muted">Stagiaire · ventilation de Mosaïk Design, octobre 2026</div></div></div>
<div class="notebook"><p class="nb-title">✎ Ma ventilation d’octobre — à contrôler</p>${Q.items.map((it, i) => {
    const lk = s.lock[i];
    let c = 'hline' + (lk ? ' ' + lk : s.flag[i] ? ' flag' : '') + (s.bounce['fa' + i] ? ' fa' : '') + (s.done && !it.wrong ? ' fine' : '');
    let extra = '';
    if (lk === 'ok' || lk === 'ok2') extra = `<span class="fixok">✏️ ${T(it.fix)}</span>`;
    else if (lk === 'ko') extra = `<span class="fixok" style="color:#a1122e">✏️ Erreur non trouvée : ${T(it.fix)}</span>`;
    else if (s.done && !it.wrong) extra = '<span class="tagok">✔ juste</span>';
    else if (s.bounce['fa' + i]) extra = '<span class="tagok" style="color:#a1122e">✘ fausse alerte (−1 XP)</span>';
    return `<button class="${c}" data-fk="h${i}" ${lk || s.done ? 'disabled' : ''} aria-pressed="${!!s.flag[i]}" onclick="hToggle(${i})"><span class="hn">${i + 1}.</span>${T(it.t)}${extra}</button>`;
  }).join('')}</div>${s.done ? '' : '<p class="small muted" style="margin-top:8px">Clique une note pour la marquer comme fausse (surlignée en jaune), reclique pour annuler.</p>'}`;
}
function hToggle(i){ const s = curS(); if (s.done || s.lock[i]) return; s.flag[i] = !s.flag[i]; renderScreen(); }
function checkHunt(l, q, Q, s){
  const errIdx = Q.items.map((it, i) => it.wrong ? i : -1).filter(i => i >= 0);
  const per = Q.pts / errIdx.length, prev = s.earned;
  const flagged = Q.items.map((_, i) => i).filter(i => !s.lock[i] && s.flag[i]);
  s.attempts++;
  let found = 0, fa = 0;
  flagged.forEach(i => {
    if (Q.items[i].wrong) { s.lock[i] = s.attempts === 1 ? 'ok' : 'ok2'; s.raw += s.attempts === 1 ? per : per / 2; if (s.attempts === 1) s.firstRaw += per; found++; }
    else { fa++; s.flag[i] = false; s.bounce['fa' + i] = 1; }
  });
  s.fa += fa; if (s.attempts === 1) s.fa1 = fa;
  const remaining = errIdx.filter(i => !s.lock[i]);
  if (s.attempts >= 2 || remaining.length === 0) {
    remaining.forEach(i => { s.lock[i] = 'ko'; });
    s.done = true;
    const v = errIdx.map(i => s.lock[i]);
    s.status = v.every(x => x === 'ok') ? 'correct' : v.includes('ko') ? 'shown' : 'hint';
  }
  s.earned = Math.max(0, s.raw - s.fa); s.first = Math.max(0, s.firstRaw - s.fa1);
  s.fb = { found, fa, okTotal:errIdx.filter(i => s.lock[i] === 'ok' || s.lock[i] === 'ok2').length, total:errIdx.length, remaining:remaining.length };
  afterCheck(l, q, prev, s.attempts === 1 ? (remaining.length === 0 && fa === 0) : undefined, fa > 0 || (!s.done && remaining.length > 0) || s.status === 'shown');
}

/* ---------- Écran Intervat (reconstitué et simplifié) ---------- */
function ivMode(Q, g){
  if (!Q.guided) return 'open';
  if (Q.given.includes(g)) return 'given';
  if (g in Q.exp) return 'todo';
  if (Q.later.includes(g)) return 'later';
  return 'na';
}
function ivScreen(co, cellFn, o){

  }).join('<div class="iv-sep"></div>');

  }).join('')}${k === 'c6' ? '<label class="iv-refund"><input type="checkbox" disabled> Je demande le remboursement</label>' : ''}</section>`;
  return `<div class="iv" role="group" aria-label="Écran Intervat reconstitué : déclaration de ${esc(co.name)}">
<div class="iv-bar"><div class="iv-dots"><i></i><i></i><i></i></div><div class="iv-url"><b>intervat</b> · Déclaration périodique à la TVA</div></div>
<div class="iv-head"><div><div class="t">Déclaration périodique</div><div>${esc(co.name)} · ${esc(co.city)}</div></div><div class="r">Numéro de TVA : ${co.vat}<br>Période : ${co.period} (${co.regime})</div></div>
<div class="iv-steps">${steps}</div>${o.guide ? `<div class="iv-guide">${o.guide}</div>` : ''}
<div class="iv-body"><div>${cad('c2', 'Cadre II · Ventes (HTVA)')}${cad('c3', 'Cadre III · Achats (HTVA)')}</div><div>${cad('c4', 'Cadre IV · Taxes dues')}${cad('c5', 'Cadre V · Taxes déductibles')}${cad('c6', 'Cadre VI · Solde')}</div></div>
${o.footer || '<div class="iv-foot"><div class="iv-status">Montants en euros, sans signe « − »</div></div>'}</div>`;

function ivReadonly(co){

function rIntervat(Q, s){
  const co = COMPANIES[Q.company];
  const cell = g => {
    const mode = ivMode(Q, g);
    if (mode === 'given') return { html:`<input class="iv-in given" value="${fmt(co.values[g])}" disabled aria-label="Grille ${g} déjà encodée">` };
    if (mode === 'na') return { html:'<input class="iv-in na" value="" disabled aria-label="Grille vide">' };
    if (mode === 'later') return { html:'<input class="iv-in later" value="" placeholder="question suivante" disabled aria-label="Grille traitée à la question suivante">' };
    const lk = s.lock[g], dis = !!lk || s.done;
    const rowCls = (lk || '') + (s.extra[g] ? ' xtra' : '') + (s.bounce[g] ? ' bounce' : '');
    let fix = '';
    if (lk === 'ko') fix = `<div class="iv-fix">→ ${fmt(Q.exp[g])}</div>`;
    else if (s.extra[g]) fix = `<div class="iv-fix${s.done ? '' : ' soft'}">↳ doit rester vide</div>`;
    const ph = mode === 'todo' ? 'à compléter' : '';
    return { rowCls, fix, html:`<input class="iv-in${mode === 'todo' ? ' todo' : ''}" id="iv_${g}" data-g="${g}" data-fk="iv${g}" inputmode="decimal" autocomplete="off" placeholder="${ph}" value="${esc(s.val[g] || '')}" ${dis ? 'disabled' : ''} oninput="ivInput(this)" onfocus="ivFocus(this)" onblur="ivBlur(this)" onkeydown="ivKey(event,this)" aria-label="Grille ${g} : ${esc(gridLabel(g))}">` };
  };
  const guide = Q.guided && !s.done ? '🧭 <b>Mode guidé</b> : clique dans une grille en pointillés ; la méthode s’affiche en bas de l’écran et les opérations concernées s’allument dans le dossier.' : '';
  return ivScreen(co, cell, { okUpTo: s.done ? (Q.company === 'plume' ? 4 : 2) : 0, guide, footer: ivFooter(Q, s) });
}
function ivFooter(Q, s){
  if (s.done) return `<div class="iv-foot"><div class="iv-status">${Q.company === 'plume' ? '📨 <b>Déclaration validée, signée et envoyée.</b> Ton accusé de réception t’attend dans le bilan de la mission.' : '✅ <b>Encodage contrôlé par Intervat.</b> Le solde est l’objet de la question suivante.'}</div></div>`;
  const warn = s.warnMsg ? `<b style="color:#8a4b00">${s.warnMsg}</b><br>` : '';
  return `<div class="iv-foot"><div class="iv-status" id="ivStatus" aria-live="polite">${warn}Montants en euros, sans signe « − ». Clique dans une grille pour voir les opérations concernées.</div><button class="iv-btn main" id="checkBtn" onclick="doCheck()" ${isReady(Q, s) ? '' : 'disabled'}>Valider l’encodage ➜</button></div>`;
}
function peekOps(co, g, guided){
  const tot = { XX:'XX = 54 + 55 + 56 + 57 + 63', YY:'YY = 59 + 64', '71':'71 = XX − YY, si XX est plus grand', '72':'72 = YY − XX, si YY est plus grand' };
  if (tot[g]) return guided ? tot[g] : { XX:'Total du cadre IV', YY:'Total du cadre V', '71':'Solde en faveur de l’État', '72':'Solde en faveur de l’entreprise' }[g];
  const isBase = BASE_GRIDS.includes(g);
  const ops = co.ops.filter(o => o.grids.includes(g) || o.grids.includes(g + '-'));
  if (!ops.length) return 'Aucune opération du dossier ne va dans cette grille : laisse-la vide.';
  return 'Dossier : ' + ops.map(o => {
    const minus = o.grids.includes(g + '-'), ref = (co.refWord ? co.refWord + ' ' : '') + o.ref;
    let amt;
    if (isBase) amt = (minus && guided ? '−' : '') + fmt(o.htva) + (minus && !guided ? ' (NC reçue)' : '');
    else amt = o.calc ? (guided ? fmt(o.htva) + ' × 21 %' : 'TVA à calculer (21 %)') : fmt(o.tva);
    return `<b>${ref}</b> ${T(amt)}`;
  }).join(' · ');
}
function ivStatusFor(g, el){

function hlGrid(g){

  document.querySelectorAll('.iv-row').forEach(r => r.classList.remove('hlf', 'hl'));
  const comp = { XX:['54','55','56','57','63'], YY:['59','64'], '71':['XX','YY'], '72':['XX','YY'] }[g];
  if (comp) comp.forEach(x => { const r = document.querySelector(`.iv-row[data-g="${x}"]`); if (r) r.classList.add('hlf'); });
  const me = document.querySelector(`.iv-row[data-g="${g}"]`); if (me) me.classList.add('hl');

  if (first && window.innerWidth >= 1024) {

    if (box) { const r = first.getBoundingClientRect(), b = box.getBoundingClientRect(); if (r.top < b.top + 70 || r.bottom > b.bottom - 10) box.scrollBy({ top:r.top - b.top - 90, behavior: reducedMotion() ? 'auto' : 'smooth' }); }

function ivFocus(el){ const g = el.dataset.g; curS().focus = g; hlGrid(g); const st = $('#ivStatus'); if (st) st.innerHTML = ivStatusFor(g, el); }
function ivInput(el){
  const g = el.dataset.g, s = curS(); if (s.done || s.lock[g]) return;
  s.val[g] = el.value; if (s.extra[g]) delete s.extra[g];
  s.warnMsg = ''; s.warned = false;

  updateCheckBtn(); saveSoon();
}
function ivBlur(el){
  const g = el.dataset.g, s = curS(); if (s.done || s.lock[g]) return;
  const v = el.value.trim(); if (!v) return;
  const n = parseNum(v);
  if (n !== null) { el.value = fmt(n); s.val[g] = el.value; }
}
function ivKey(e, el){
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const all = [...document.querySelectorAll('.iv-in[data-g]:not([disabled])')];
  const i = all.indexOf(el); if (i >= 0 && i < all.length - 1) all[i + 1].focus(); else el.blur();
}
function checkIntervat(l, q, Q, s){
  const editable = ALL_GRIDS.filter(g => ['open','todo'].includes(ivMode(Q, g)));
  const req = Object.keys(Q.exp).filter(g => !s.lock[g]);
  /* Avertissement (exercice ouvert) : moins de grilles remplies que nécessaire */
  const filledReq = editable.filter(g => !s.lock[g] && (s.val[g] || '').trim()).length;
  if (!Q.guided && !s.warned && filledReq < req.length) {
    s.warned = true;
    s.warnMsg = `⚠️ Tu as rempli ${filledReq} grille(s). Vérifie qu’il ne manque rien ; clique encore sur « Valider » pour confirmer.`;
    renderScreen(); return;
  }
  s.warnMsg = ''; s.warned = false;
  /* Grilles remplies qui devaient rester vides */
  editable.filter(g => !(g in Q.exp) && (s.val[g] || '').trim() && parseNum(s.val[g]) !== 0)
    .forEach(g => { s.extra[g] = 1; s.val[g] = ''; s.bounce[g] = 1; });
  /* Indices ciblés (diagnostic des erreurs fréquentes) */
  s.diag = {};
  req.forEach(g => {
    const v = parseNum(s.val[g]);
    if (v === null || Math.abs(v - Q.exp[g]) > 0.02) {
      const d = v !== null && Q.diag && Q.diag[g] ? Q.diag[g][Math.round(v)] : null;
      s.diag[g] = d || (Q.tips && Q.tips[g]) || (Q.hints && Q.hints[g]) || 'Recalcule cette grille à partir du dossier.';
    }
  });
  itemCheck(l, q, Q, s, req, g => { const v = parseNum(s.val[g]); return v !== null && Math.abs(v - Q.exp[g]) <= 0.02; }, g => { s.val[g] = ''; s.bounce[g] = 1; });
}

/* ---------- Dispatch ---------- */
function renderBody(Q, s){
  switch (Q.type) {
    case 'qcm': return rQcm(Q, s);
    case 'multi': return rMulti(Q, s);
    case 'num': return rNum(Q, s);
    case 'vf': return rVf(Q, s);
    case 'zones': return rZones(Q, s);
    case 'match': return rMatch(Q, s);
    case 'order': return rOrder(Q, s);
    case 'cloze': return rCloze(Q, s);
    case 'hunt': return rHunt(Q, s);
    case 'intervat': return rIntervat(Q, s);
  }
  return '';
}
function doCheck(){
  const l = APP.level, q = APP.q, Q = curQ(), s = curS();
  if (!isReady(Q, s)) return;
  switch (Q.type) {
    case 'qcm': return checkQcm(l, q, Q, s);
    case 'multi': return checkMulti(l, q, Q, s);
    case 'num': return checkNum(l, q, Q, s);
    case 'zones': return checkZones(l, q, Q, s);
    case 'match': return checkMatch(l, q, Q, s);
    case 'order': return checkOrder(l, q, Q, s);
    case 'cloze': return checkCloze(l, q, Q, s);
    case 'hunt': return checkHunt(l, q, Q, s);
    case 'intervat': return checkIntervat(l, q, Q, s);
  }
}

  }

      : Q.type === 'match' ? (one ? 'La ligne restante a été remise à zéro.' : `Les ${f.wrong} autres lignes ont été remises à zéro.`)
      : Q.type === 'order' ? (one ? 'L’étiquette mal placée est revenue avec les autres.' : `Les ${f.wrong} étiquettes mal placées sont revenues avec les autres.`)
      : (one ? 'L’élément restant est revenu dans la réserve.' : `Les ${f.wrong} autres sont revenus dans la réserve.`);
    let diag = '';

/* ---------- Bilan de mission ---------- */
function predSentence(l, st){
  const p = PREDICTIONS.find(x => x.id === APP.predictions[l]); if (!p) return '';
  const out = predOutcome(st.firstQ), order = { half:0, tq:1, all:2 };
  const verdict = p.id === out ? 'Bonne estimation, tu te connais bien ! 🎯' : order[out] > order[p.id] ? 'Tu as fait mieux que prévu : tu peux te faire confiance ! 💪' : 'Un peu moins que prévu : relis les corrections, c’est là que tu progresses.';
  return `Tu avais prédit <b>« ${T(p.label.replace(' !', ''))} »</b> ; tu as réussi <b>${st.c}/${st.n}</b> question(s) du premier coup. ${verdict}`;
}

/* ---------- Bilan final par critères et indicateurs (CONVENTIONS §4.11) ---------- */
function bilanIndicateurs(){
  const acc = {};
  LEVELS.forEach((lv, l) => lv.questions.forEach((q, i) => {
    const a = acc[q.ind] || (acc[q.ind] = { pts:0, max:0 });
    a.max += q.pts; a.pts += (APP.qs[l + '_' + i] && APP.qs[l + '_' + i].earned) || 0;
  }));
  const statut = r => r >= 0.8 ? 'atteint' : r >= 0.5 ? 'encours' : 'nonatteint';
  return CRITERES.map(c => {
    const inds = c.indicateurs.map(ind => { const a = acc[ind.id] || { pts:0, max:0 }; const r = a.max ? a.pts / a.max : 0; return Object.assign({}, ind, { ratio:r, statut:statut(r) }); });
    const tot = c.indicateurs.reduce((t, ind) => { const a = acc[ind.id] || { pts:0, max:0 }; return { pts:t.pts + a.pts, max:t.max + a.max }; }, { pts:0, max:0 });
    const r = tot.max ? tot.pts / tot.max : 0;
    return { id:c.id, nom:c.nom, ratio:r, statut:statut(r), indicateurs:inds };
  });
}
const ST_LABEL = { atteint:'✅ Atteint', encours:'🟠 En cours d’acquisition', nonatteint:'❌ Non atteint' };

  }
  btn.textContent = '⏳ Vérification…'; btn.disabled = true;

  const cbName = '_emailCb_' + Date.now();

    delete window[cbName]; const s = document.getElementById(cbName); if (s) s.remove();
    errDiv.textContent = '⚠️ Connexion impossible. Vérifie ta connexion internet.';
    btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false;
  }, 10000);
  window[cbName] = function(resp){

    const s = document.getElementById(cbName); if (s) s.remove();
    btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false;
    if (resp && resp.found) {
      const oldEmail = store.get('student_email');
      store.set('student_email', email);
      store.set('student_classe', resp.classe || '');
      APP.email = email; APP.classe = resp.classe || '';

      document.getElementById('emailOverlay').style.display = 'none';

      input.style.borderColor = '#ff4060';

  s.id = cbName;
  s.src = `${TRACKING.scriptUrl}?action=check_email&email=${encodeURIComponent(email)}&callback=${cbName}`;

    const pctC = pct >= 80 ? '#22d68a' : pct >= 50 ? '#ff8a3d' : '#ff4060';
    let tStr = '—'; if (temps > 0) { const m = Math.floor(temps / 60), s = temps % 60; tStr = m > 0 ? m + 'm' + String(s).padStart(2, '0') + 's' : s + 's'; }
    html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.03);background:${isMe ? 'rgba(34,214,138,0.08)' : 'transparent'};"><td style="padding:8px 4px;font-weight:700;">${r <= 3 && r > 0 ? medals[r - 1] : r}</td><td style="padding:8px 4px;${isMe ? 'font-weight:800;color:var(--accent,#22d68a);' : ''}">${name}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:var(--accent,#22d68a);">${row.totalPoints}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:${pctC};">${pct}%</td><td style="padding:8px 4px;text-align:right;color:var(--text2,#999);font-family:monospace;font-size:0.78rem;">${tStr}</td></tr>`;
  });
  html += '</table>';
  content.innerHTML = html;
}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
function setHudHeight(){ const h = document.getElementById('hud'); if (h) document.documentElement.style.setProperty('--hud-h', h.offsetHeight + 'px'); }
function init(){
  document.getElementById('logoArt').innerHTML = SVG.logo();
  setHudHeight();
  if (window.ResizeObserver) new ResizeObserver(setHudHeight).observe(document.getElementById('hud'));
  else window.addEventListener('resize', setHudHeight);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    closeMemo();
    if (document.getElementById('lbOverlay').style.display !== 'none') closeLB();
    if (document.getElementById('rankOverlay').style.display !== 'none') closeRankUp();
  });
  renderScreen(); updateHUD();
  showEmailModal();   /* ← TOUJOURS, même si un email est déjà enregistré (SPEC v5) */
}
init();
</script>
</body>
